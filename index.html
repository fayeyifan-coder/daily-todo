<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日待办清单</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f5f5f7; 
            padding: 20px 16px; 
            margin: 0; 
            color: #1d1d1f; 
        }
        .card { 
            max-width: 420px; 
            margin: 20px auto; 
            background: #ffffff; 
            border-radius: 18px; 
            padding: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        h2 { font-size: 22px; margin: 0 0 6px 0; font-weight: 700; }
        .date { font-size: 14px; color: #86868b; margin-bottom: 20px; }
        .item { 
            display: flex; 
            align-items: center; 
            padding: 14px 0; 
            border-bottom: 1px solid #f0f0f5; 
            cursor: pointer; 
            user-select: none;
            transition: opacity 0.2s;
        }
        .item:last-child { border-bottom: none; }
        input[type="checkbox"] { 
            width: 22px; 
            height: 22px; 
            margin-right: 14px; 
            accent-color: #34c759; 
            cursor: pointer; 
        }
        .text { font-size: 17px; flex: 1; transition: all 0.2s; }
        .completed .text { 
            text-decoration: line-through; 
            color: #86868b; 
        }
        .progress-bar {
            height: 8px;
            background: #e5e5ea;
            border-radius: 4px;
            margin-top: 24px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #34c759;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text { 
            margin-top: 10px; 
            text-align: center; 
            font-size: 14px; 
            color: #86868b; 
            font-weight: 500; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>☀️ 今日待办清单</h2>
        <div class="date" id="dateStr"></div>
        <div id="todoList"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressStr">完成度: 0 / 6</div>
    </div>

    <script>
        const tasks = [
            { id: 'words', text: '📝 背单词' },
            { id: 'reading', text: '📖 看书' },
            { id: 'news', text: '📰 看新闻' },
            { id: 'journal', text: '📓 写日记' },
            { id: 'proofread', text: '✏️ 修文' },
            { id: 'writing', text: '✍️ 写作' }
        ];

        // 获取今天日期 (YYYY-MM-DD)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateStr').innerText = today;

        // 从 localStorage 中读取今天的状态，如果换天了会自动重置
        let state = JSON.parse(localStorage.getItem('bark_todo_' + today) || '{}');

        function saveState() {
            localStorage.setItem('bark_todo_' + today, JSON.stringify(state));
            updateProgress();
        }

        function updateProgress() {
            const completedCount = Object.values(state).filter(Boolean).length;
            const percent = (completedCount / tasks.length) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressStr').innerText = `完成度: ${completedCount} / ${tasks.length}`;
        }

        const listEl = document.getElementById('todoList');
        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = 'item' + (state[task.id] ? ' completed' : '');
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = !!state[task.id];
            
            const text = document.createElement('span');
            text.className = 'text';
            text.innerText = task.text;

            const toggle = (e) => {
                if (e.target !== checkbox) {
                    checkbox.checked = !checkbox.checked;
                }
                state[task.id] = checkbox.checked;
                item.classList.toggle('completed', checkbox.checked);
                saveState();
            };

            checkbox.addEventListener('change', toggle);
            item.addEventListener('click', toggle);

            item.appendChild(checkbox);
            item.appendChild(text);
            listEl.appendChild(item);
        });

        updateProgress();
    </script>
</body>
</html>
